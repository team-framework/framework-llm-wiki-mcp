name: Deploy Wiki MCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, framework-wiki-mcp]
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test
          npm run build

      - name: Sync and restart service
        run: |
          app_dir=/home/chaeyn/apps/framework-llm-wiki-mcp
          install -d -m 700 "$app_dir"
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            ./ "$app_dir/"
          cd "$app_dir"
          docker compose up -d --build --remove-orphans
          docker compose ps
